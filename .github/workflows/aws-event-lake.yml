name: AWS Agent Event Lake

on:
  push:
    branches: [main]
    paths:
      - "agent/telemetry/**"
      - "agent/autonomy/runtime.py"
      - "infra/aws-event-lake/**"
      - "tests/test_telemetry.py"
      - ".env.example"
      - "README.md"
      - "docs/aws-event-lake.md"
      - ".github/workflows/aws-event-lake.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent/telemetry/**"
      - "agent/autonomy/runtime.py"
      - "infra/aws-event-lake/**"
      - "tests/test_telemetry.py"
      - ".env.example"
      - "README.md"
      - "docs/aws-event-lake.md"
      - ".github/workflows/aws-event-lake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-tests:
    name: Agent event telemetry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Validate telemetry and runtime behavior
        env:
          PYTHONPATH: .
        run: pytest tests/test_telemetry.py tests/test_autonomous_runtime.py -v

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive infra/aws-event-lake
      - name: Initialize providers without backend
        working-directory: infra/aws-event-lake
        run: terraform init -backend=false
      - name: Validate event-lake infrastructure
        working-directory: infra/aws-event-lake
        run: terraform validate
